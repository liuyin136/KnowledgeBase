# =============================================================================
# docker-compose.yml — Local-First RAG Platform (no experiments node)
# Per infrastructure-environment-spec_v1.1.md §3 (updated for v1.3 Jina models)
#
# Usage (from project root, via the thin root docker-compose.yml include):
#   docker compose build
#   docker compose run --rm api-worker python scripts/read-only/init_neo4j.py
#   docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Neo4j
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: raglab-neo4j
    ports:
      - "7474:7474"   # HTTP browser + REST
      - "7687:7687"   # Bolt (driver protocol)
    environment:
      NEO4J_AUTH: neo4j/P@ssw0rd
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [default]

  # ---------------------------------------------------------------------------
  # Redis — RQ job queue + file read cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: raglab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [default]

  # ---------------------------------------------------------------------------
  # Backend — Slim FastAPI API gateway (CPU, no models)
  # Connects: frontend, Neo4j, Redis, shared /data
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: raglab-backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: P@ssw0rd
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: default
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_ORIGIN: "*"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      DATA_ROOT: /data
      FILE_CACHE_TTL: "3600"
      FILE_CACHE_MAX_BYTES: "1048576"
      DEFAULT_COARSE_DIM: "256"
      SEARCH_CACHE_TTL: "3600"
      CHUNK_TOKEN_MAX: "29500"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: knowledgebase-api
      VAULT_DB_PATH: /var/lib/rag/vault.db
    volumes:
      - ../data:/data
      - vault_db_data:/var/lib/rag
      - ../backend/app:/app/app
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [default]

  # ---------------------------------------------------------------------------
  # API worker — GPU worker: models, scripts, RQ job execution
  # ---------------------------------------------------------------------------
  api-worker:
    image: raglab-api-worker:latest
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: raglab-api-worker
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: P@ssw0rd
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: default
      MODEL_PATH: /app/models
      CUDA_VISIBLE_DEVICES: "0"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMBEDDING_DIM: "1024"
      EMBEDDING_MODEL: jina-v5-small
      RERANKER_MODEL: jina-v3
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      WORKER_CONCURRENCY: "1"
      DATA_ROOT: /data
      DEFAULT_COARSE_DIM: "256"
      SEARCH_CACHE_TTL: "3600"
      CHUNK_TOKEN_MAX: "29500"
      RERANK_N_CTX: "131072"
      RERANK_N_BATCH: "131072"
      PENDING_RERANK_TTL_SEC: "1800"
      INGEST_PROGRESS_TTL_SEC: "1800"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: knowledgebase-worker
      VAULT_DB_PATH: /var/lib/rag/vault.db
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks: [default]
    volumes:
      - ../backend/scripts:/app/scripts
      - ../backend/app:/app/app
      - ../tests:/app/tests
      - ../data:/data
      - vault_db_data:/var/lib/rag

  # ---------------------------------------------------------------------------
  # Frontend — Next.js 16 (standalone). Serves :3000, proxies /api/v1/* → backend.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: raglab-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: ""
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [default]

  jaeger:
    image: jaegertracing/all-in-one:1.64
    container_name: raglab-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles: ["otel"]
    restart: unless-stopped
    networks: [default]

volumes:
  neo4j_data:
    driver: local
  redis_data:
    driver: local
  vault_db_data:
    driver: local

networks:
  default:
    driver: bridge
